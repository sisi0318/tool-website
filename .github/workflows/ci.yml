name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner 固定在 24.04:ubuntu-latest 换代时,Playwright 的 --with-deps 要等新版本才认得新系统,
# 那几周 e2e 会在装依赖这一步莫名失败。要升级时连同 @playwright/test 一起改。
jobs:
  check:
    name: 类型 / 规范 / 单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: ESLint
        # 警告一律当错误:现存的每一处豁免都写明了理由,新增的必须同样交代清楚
        run: npm run lint -- --max-warnings 0

      - name: 单元测试
        run: npm test

      - name: 依赖安全审计
        # 只看运行时依赖的高危项;开发依赖的传递告警不阻断构建。
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: 端到端测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 构建前要下两个 OCR 模型(共约 31 MB,只有一个地域的源站),跨洲拉取偶尔不通。
      # 脚本把校验过的模型留在 node_modules/.cache 下,这里按清单内容缓存;放在 npm ci 之后,
      # 因为 npm ci 会先清空 node_modules。
      - name: 缓存 OCR 模型
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/ocr-models
          key: ocr-models-${{ hashFiles('vendor/ocr/models.json') }}

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 构建
        run: npm run build
        env:
          DISABLE_PWA: "true"
          NEXT_PUBLIC_E2E: "true"

      - name: 运行 e2e
        # 复用上一步的构建产物,避免 playwright.config 再构建一次
        run: npm run e2e
        env:
          PLAYWRIGHT_SKIP_BUILD: "true"
          DISABLE_PWA: "true"
          NEXT_PUBLIC_E2E: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
